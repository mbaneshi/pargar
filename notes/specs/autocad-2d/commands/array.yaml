unverified:
  - exact prompt wording for grip-edit states — synthesized from official docs but never tested live
  - whether ARRAYRECT count prompt uses "columns and rows" or "columns x rows" format
  - whether Expression sub-option is available in all versions or only 2012+
  - exact default item counts (4 columns, 3 rows assumed from docs — may differ)
  - whether legacy -ARRAY shows "---" and "|||" indicators in prompts or only in docs
  - whether ARRAYPOLAR "Angle between" vs "Fill angle" defaults are 60/360 or vary by version
