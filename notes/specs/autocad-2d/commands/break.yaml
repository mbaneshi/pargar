      - "https://thecadmasters.com/autocad-command-shortcuts/"
      - "Multiple community alias lists confirm BR as the BREAK alias"
    confidence: high
  prompts.select_object:
    sources:
      - "AutoCAD 2024 Help BREAK command reference (GUID-36A1CDE0)"
      - "https://allaboutcad.com/breaking-a-line-into-two/"
      - "AutoCAD 2023 Mac Help (GUID-7F63FF08)"
    confidence: high
  prompts.second_break_point:
    sources:
      - "AutoCAD 2024 Help BREAK command reference"
      - "https://www.cadforum.cz/en/command.asp?cmd=BREAK"
      - "Autodesk Forum thread on _F option"
    confidence: high
  prompts.first_point_override:
    sources:
      - "AutoCAD 2024 Help BREAK command reference"
      - "https://forums.autodesk.com/t5/visual-lisp-autolisp-and-general/quot-f-quot-option-calling-break-command/td-p/9107812"
    confidence: high
  break_at_point:
    sources:
      - "https://forums.autodesk.com/t5/autocad-forum/quot-break-at-point-quot-command-shortcut/td-p/8085842"
      - "https://www.cadtutor.net/forum/topic/945-break-a-line-at-a-single-point/"
    confidence: high
  circle_break_behavior:
    sources:
      - "General AutoCAD knowledge — circles break CCW from first to second point"
    confidence: medium
    note: Direction of break on circles is well-established but not directly sourced from official 2024 docs.

unverified:
  - exact wording of "Specify second break point or [First point]:" — may be "[First point]" or "[First]" depending on version
  - whether the F option prompt says "Specify first break point:" or "Specify first point:" (with/without "break")
  - exact behavior when breaking a closed polyline (may become open polyline rather than two polylines)
  - whether BREAK works on 3D polylines in all cases
  - exact macro string for BREAK AT POINT toolbar button — ^C^C_break;_f;\\;@ is commonly cited but version-specific
  - whether xline break produces a ray or a line depending on which side of the break point
